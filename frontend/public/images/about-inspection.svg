<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t">
<title id="t">A motorcycle with inspection checkpoints marked on the engine, brakes, tyres and lights, next to a ticked checklist</title>
<rect width="800" height="600" fill="#fdf0f3"/>
<ellipse cx="405" cy="522" rx="340" ry="11" fill="#f3d3db"/>

<!-- checklist -->
<rect x="48" y="44" width="300" height="196" rx="16" fill="#fff" stroke="#e5e7eb" stroke-width="2"/>
<rect x="72" y="68" width="124" height="11" rx="5.5" fill="#111827"/>
<rect x="72" y="88" width="84" height="8" rx="4" fill="#e5e7eb"/>
<rect x="72" y="118" width="20" height="20" rx="6" fill="#d23657"/><path d="M76.8 128.9 L80.5 133.0 L88.0 124.0" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="104" y="124" width="168" height="9" rx="4.5" fill="#e5e7eb"/><rect x="72" y="146" width="20" height="20" rx="6" fill="#d23657"/><path d="M76.8 156.9 L80.5 161.0 L88.0 152.0" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="104" y="152" width="132" height="9" rx="4.5" fill="#e5e7eb"/><rect x="72" y="174" width="20" height="20" rx="6" fill="#d23657"/><path d="M76.8 184.9 L80.5 189.0 L88.0 180.0" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="104" y="180" width="150" height="9" rx="4.5" fill="#e5e7eb"/><rect x="72" y="202" width="20" height="20" rx="6" fill="#d23657"/><path d="M76.8 212.9 L80.5 217.0 L88.0 208.0" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="104" y="208" width="112" height="9" rx="4.5" fill="#e5e7eb"/>

<!-- count chip -->
<rect x="566" y="48" width="186" height="52" rx="26" fill="#111827"/>
<text x="659" y="81" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#fff">200+ checks</text>

<!-- motorcycle -->
<g fill="none" stroke="#111827" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
  <!-- wheels -->
  <circle cx="200" cy="430" r="82" fill="#fff"/>
  <circle cx="200" cy="430" r="60" stroke="#6b7280" stroke-width="3"/>
  <circle cx="610" cy="430" r="82" fill="#fff"/>
  <circle cx="610" cy="430" r="60" stroke="#6b7280" stroke-width="3"/>
  <circle cx="610" cy="430" r="34" stroke="#6b7280" stroke-width="3"/>
  <!-- swingarm, shock, frame -->
  <path d="M352 382 L200 430"/>
  <path d="M294 308 L272 406" stroke-width="6"/>
  <path d="M530 290 L470 352" stroke-width="6"/>
  <!-- exhaust -->
  <path d="M430 398 L262 376" stroke="#6b7280" stroke-width="14"/>
  <!-- engine -->
  <rect x="345" y="306" width="128" height="90" rx="14" fill="#fff"/>
  <path d="M368 330 H452 M368 350 H452 M368 370 H452" stroke="#e5e7eb" stroke-width="4"/>
  <!-- seat -->
  <path d="M232 292 C262 278 322 280 352 292 L352 308 L238 314 C222 310 222 298 232 292 Z" fill="#111827"/>
  <!-- tank -->
  <path d="M530 272 C500 238 402 236 354 262 C338 272 336 294 354 302 L522 302 Z" fill="#d23657"/>
  <!-- fork, bars, headlight -->
  <path d="M610 430 L545 262"/>
  <path d="M545 262 L520 232 L478 228"/>
  <path d="M478 228 L462 226" stroke-width="10"/>
  <circle cx="582" cy="292" r="25" fill="#fff"/>
  <circle cx="200" cy="430" r="9" fill="#111827" stroke="none"/>
</g>

<!-- inspection markers: engine, brakes, tyres, lights -->
<circle cx="409" cy="350" r="18" fill="#fff" stroke="#d23657" stroke-width="4"/><path d="M402.0 350.5 L407.0 356.0 L417.0 344.0" fill="none" stroke="#d23657" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="610" cy="430" r="18" fill="#fff" stroke="#d23657" stroke-width="4"/><path d="M603.0 430.5 L608.0 436.0 L618.0 424.0" fill="none" stroke="#d23657" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="200" cy="430" r="18" fill="#fff" stroke="#d23657" stroke-width="4"/><path d="M193.0 430.5 L198.0 436.0 L208.0 424.0" fill="none" stroke="#d23657" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="582" cy="292" r="18" fill="#fff" stroke="#d23657" stroke-width="4"/><path d="M575.0 292.5 L580.0 298.0 L590.0 286.0" fill="none" stroke="#d23657" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
